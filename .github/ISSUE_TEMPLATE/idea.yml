name: 💡 Suggest an idea
description: Propose an AI agent, marketing-tech tool or B2B calculator for the Ideas Lab
title: "💡 "
labels: ["idea", "status: idea"]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing! Ideas with a clear problem and audience get votes (and built) fastest.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's painful, slow or expensive today? Who feels it?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should the tool or agent do? Inputs, outputs, integrations.
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [AI visibility / AEO, Sales AI, Ads & tracking, B2B calculators, Other]
  - type: input
    id: who
    attributes:
      label: Who is it for?
      placeholder: e.g. B2B SaaS marketing teams, PPC agencies, manufacturers
